<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Snack Isle…</title>
<meta name="description" content="Open a shared Snack Isle link in the app or download Snack Isle from the App Store or Google Play.">
<meta name="robots" content="noindex">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    color: #1A1712;
    line-height: 1.6;
    background: #fdf6e8;
    text-align: center;
  }
  h1 { color: #5C3D8A; font-size: 22px; margin: 40px 0 8px; }
  p { font-size: 15px; margin: 0 0 12px; color: #4A4438; }
  a.store-link {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 24px;
    background: #5C3D8A;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 15px;
  }
</style>
</head>
<body>

<h1>Opening Snack Isle…</h1>
<p>If nothing happens, you may not have the app installed yet.</p>
<a class="store-link" id="storeLink" href="https://apps.apple.com/us/app/snack-isle/id6791022824">Get Snack Isle on the App Store</a>

<script>
  // Shared-link landing page: shared snack/profile/etc. links point HERE
  // (a normal webpage, not the app's own snack-isle:// scheme directly) so
  // that someone WITHOUT the app installed lands somewhere useful instead
  // of a dead "cannot open page" error, since a plain custom URL scheme
  // has no OS-level fallback behavior of its own.
  //
  // ?to=<path> carries where inside the app to land (e.g. "snack/abc123");
  // defaults to the app's root if missing/malformed. Attempts the deep
  // link immediately, then falls back to the App Store after a short delay
  // ONLY if the tab is still visible/foregrounded: if the OS actually
  // switched to the app (the deep link worked), the page is backgrounded
  // and this fallback never fires. Not a true Universal Link — that needs
  // an apple-app-site-association file hosted at the domain root plus an
  // associatedDomains entitlement in the app, neither set up yet even
  // though a domain (snackisleapp.com, see docs/EXTERNAL_DEPENDENCIES.md's
  // "Hosting / domain" section) now exists to host one on — so this stays
  // the "just JavaScript" middle ground: a visible redirect hop, hosted on
  // the same GitHub Pages site as the rest of the legal pages.
  (function () {
    // Point the fallback at the store the visitor can actually install
    // from. This link is hardcoded to the App Store in the markup, so
    // before this an Android visitor without the app landed on an iOS
    // listing and had no way to get Snack Isle at all -- which is the one
    // job this page has. Matters most for invite links, where the whole
    // point is reaching someone who does NOT have the app yet.
    //
    // Sniffing the user agent is crude, but it is the only signal a static
    // page has, and the failure mode is symmetric: an unrecognised agent
    // keeps the existing App Store link rather than guessing.
    if (/android/i.test(navigator.userAgent)) {
      var storeLink = document.getElementById("storeLink");
      storeLink.href =
        "https://play.google.com/store/apps/details?id=com.snackisle.app";
      storeLink.textContent = "Get Snack Isle on Google Play";
    }

    var params = new URLSearchParams(window.location.search);
    var to = params.get("to") || "";
    // Guards against an arbitrary/malicious `to` value being reflected
    // straight into a custom-scheme URL: only allow the characters an
    // actual expo-router path segment would ever contain.
    var safeTo = /^[A-Za-z0-9/_-]*$/.test(to) ? to : "";
    // Referral code from an invite link, forwarded into the app so
    // onboarding can pre-fill it. Without this the app's own ?ref=
    // handler could never fire: the code was written into the invite
    // message and into this page's URL, but dropped here, so the whole
    // pre-fill path was dead.
    //
    // Same reflection guard as `to` above, but stricter because the shape
    // is known exactly: six characters from profiles.referral_code's own
    // alphabet (migration 246), which omits 0/O/1/I/L. Anything else is
    // dropped rather than passed along. encodeURIComponent is a no-op on
    // that character set and kept only so this stays safe if the pattern
    // is ever loosened.
    var ref = (params.get("ref") || "").toUpperCase();
    var safeRef = /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$/.test(ref) ? ref : "";
    var appLink =
      "snack-isle://" + safeTo + (safeRef ? "?ref=" + encodeURIComponent(safeRef) : "");

    var fallbackTimer = setTimeout(function () {
      window.location.href = document.getElementById("storeLink").href;
    }, 1500);

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) clearTimeout(fallbackTimer);
    });

    window.location.href = appLink;
  })();
</script>

</body>
</html>
